<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TensorFlow.js Face Mesh</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#101318;color:#eef2f7}header,main{padding:16px}h1{font-size:1.25rem;margin:0 0 8px}p{color:#b7c1d0}.stage{position:relative;max-width:900px;aspect-ratio:4/3;background:#05070a}video,canvas{position:absolute;width:100%;height:100%;inset:0;object-fit:cover}video{transform:scaleX(-1)}button{padding:10px 14px;border:0;border-radius:8px;background:#7ce0c3;font-weight:700;margin-right:8px}#status{margin-top:12px;color:#b7c1d0}a{color:#7ce0c3}
</style>
</head>
<body>
<header><h1>TensorFlow.js · Face Mesh</h1><p>Alternative runtime for the 478-point face landmark task.</p><a href="./">← MediaPipe + Three.js demo</a></header>
<main>
<div class="stage"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas></div>
<p><button id="start">Start camera</button><button id="stop" disabled>Stop</button></p>
<div id="status">Loading TensorFlow.js model…</div>
</main>
<script type="module">
import * as tf from "https://esm.sh/@tensorflow/tfjs-core@4.22.0";
import "https://esm.sh/@tensorflow/tfjs-converter@4.22.0";
import "https://esm.sh/@tensorflow/tfjs-backend-webgl@4.22.0";
import * as faceLandmarksDetection from "https://esm.sh/@tensorflow-models/face-landmarks-detection@1.0.6?bundle";
const video=document.querySelector("#video"), canvas=document.querySelector("#overlay"), ctx=canvas.getContext("2d");
const status=document.querySelector("#status"), start=document.querySelector("#start"), stop=document.querySelector("#stop");
let detector=null, stream=null, raf=0, busy=false;
async function init(){
 try{
  await tf.setBackend("webgl"); await tf.ready();
  detector=await faceLandmarksDetection.createDetector(faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh,{
   runtime:"tfjs", refineLandmarks:true, maxFaces:1
  });
  status.textContent="Ready. Start the camera.";
 }catch(e){console.error(e);status.textContent="Model load failed. Check browser console and internet connection."}
}
function draw(faces){
 const w=video.videoWidth||640,h=video.videoHeight||480;
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
 ctx.clearRect(0,0,w,h);ctx.fillStyle="#7ce0c3";
 for(const face of faces) for(const p of face.keypoints){
  ctx.beginPath();ctx.arc(w-p.x,p.y,1.25,0,Math.PI*2);ctx.fill();
 }
 status.textContent=faces.length?"TensorFlow.js · "+faces[0].keypoints.length+" landmarks":"TensorFlow.js · no face detected";
}
async function loop(){
 raf=requestAnimationFrame(loop);
 if(!detector||video.readyState<2||busy)return;
 busy=true;
 try{draw(await detector.estimateFaces(video,{flipHorizontal:false}));}catch(e){console.error(e)}
 finally{busy=false}
}
start.onclick=async()=>{
 if(!detector){status.textContent="Model is still loading.";return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});video.srcObject=stream;await video.play();start.disabled=true;stop.disabled=false;cancelAnimationFrame(raf);loop()}
 catch(e){console.error(e);status.textContent="Camera unavailable. Use HTTPS/localhost and allow camera access."}
};
stop.onclick=()=>{cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;ctx.clearRect(0,0,canvas.width,canvas.height);start.disabled=false;stop.disabled=true;status.textContent="Camera stopped."};
await init();
</script>
</body>
</html>
