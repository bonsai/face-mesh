<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Face Mesh Lab</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#101318;color:#eef2f7}header{padding:16px 20px;border-bottom:1px solid #303744}h1{font-size:1.25rem;margin:0 0 6px}p{margin:0;color:#aeb8c8;font-size:.92rem}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:14px}.panel{min-width:0;background:#191e27;border:1px solid #303744;border-radius:12px;overflow:hidden}.panel h2{font-size:.95rem;margin:0;padding:11px 14px;border-bottom:1px solid #303744}.stage{position:relative;width:100%;aspect-ratio:4/3;background:#080a0e;overflow:hidden}video,canvas,#three{position:absolute;inset:0;width:100%;height:100%}video{object-fit:cover;transform:scaleX(-1)}canvas{pointer-events:none}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px}button{border:0;border-radius:8px;padding:9px 13px;background:#7ce0c3;color:#08130f;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}#status,#pose{font-size:.88rem;color:#aeb8c8}.metrics{padding:0 14px 14px;display:flex;gap:18px;flex-wrap:wrap;font-size:.9rem}.metrics strong{color:#7ce0c3}footer{padding:0 16px 18px;color:#aeb8c8;font-size:.82rem}@media(max-width:760px){main{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Face Mesh Lab</h1><p>MediaPipe Face + Hand Landmarks · Three.js 3D point cloud · ブラウザー内で処理</p></header>
<main><section class="panel"><h2>Camera · 2D landmarks</h2><div class="stage"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas></div><div class="controls"><button id="start">カメラ開始</button><button id="stop" disabled>停止</button><span id="status">モデルを読み込み中…</span></div><div class="metrics"><span>顔: <strong id="faces">0</strong></span><span>手: <strong id="hands">0</strong></span><span>口の開き: <strong id="jaw">—</strong></span></div></section>
<section class="panel"><h2>Three.js · 3D face landmarks</h2><div class="stage" id="three"></div><div class="controls"><span id="pose">カメラを開始して顔を動かしてください。</span></div></section></main>
<footer>カメラへのアクセスには HTTPS または localhost が必要です。映像はこのページ内で処理し、サーバーには送信しません。</footer>
<script type="module">
import {FaceLandmarker,HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs";
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";
const $=s=>document.querySelector(s),video=$("#video"),canvas=$("#overlay"),ctx=canvas.getContext("2d"),status=$("#status"),start=$("#start"),stop=$("#stop");
let faceModel=null,handModel=null,stream=null,raf=0,lastTime=-1;
const handEdges=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080a0e);const camera=new THREE.PerspectiveCamera(45,4/3,.01,100);camera.position.set(0,0,2.6);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));$("#three").appendChild(renderer.domElement);
const group=new THREE.Group();scene.add(group);const pointsGeometry=new THREE.BufferGeometry(),points=new THREE.Points(pointsGeometry,new THREE.PointsMaterial({color:0x7ce0c3,size:.012,sizeAttenuation:true}));group.add(points);
const wireGeometry=new THREE.BufferGeometry(),wire=new THREE.LineSegments(wireGeometry,new THREE.LineBasicMaterial({color:0x4a9fba,transparent:true,opacity:.7}));group.add(wire);
function resize3d(){const host=$("#three");camera.aspect=host.clientWidth/Math.max(1,host.clientHeight);camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)}window.addEventListener("resize",resize3d);
async function loadModels(){try{const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm");faceModel=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:new URL("./models/face_landmarker.task",document.baseURI).href,delegate:"GPU"},runningMode:"VIDEO",numFaces:1,outputFaceBlendshapes:true});handModel=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:new URL("./models/hand_landmarker.task",document.baseURI).href,delegate:"GPU"},runningMode:"VIDEO",numHands:2});status.textContent="準備完了。カメラを開始してください。"}catch(e){console.error(e);status.textContent="モデル読み込み失敗。GitHub Pages の Actions と Console を確認してください。"}}
function drawPoints(ps,color,r=1.3){ctx.fillStyle=color;for(const p of ps){ctx.beginPath();ctx.arc((1-p.x)*canvas.width,p.y*canvas.height,r,0,Math.PI*2);ctx.fill()}}
function drawConnections(ps,edges,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;for(const [a,b] of edges){const p=ps[a],q=ps[b];if(!p||!q)continue;ctx.beginPath();ctx.moveTo((1-p.x)*canvas.width,p.y*canvas.height);ctx.lineTo((1-q.x)*canvas.width,q.y*canvas.height);ctx.stroke()}}
function update3d(ps){const coords=new Float32Array(ps.length*3);for(let i=0;i<ps.length;i++){const p=ps[i];coords.set([(.5-p.x)*1.8,(.5-p.y)*1.8,-p.z*1.2],i*3)}pointsGeometry.setAttribute("position",new THREE.BufferAttribute(coords,3));pointsGeometry.computeBoundingSphere();
const edges=FaceLandmarker.FACE_LANDMARKS_CONTOURS||[],lines=[];for(const e of edges){const a=ps[e.start],b=ps[e.end];if(a&&b)for(const p of [a,b])lines.push((.5-p.x)*1.8,(.5-p.y)*1.8,-p.z*1.2)}wireGeometry.setAttribute("position",new THREE.Float32BufferAttribute(lines,3));wireGeometry.computeBoundingSphere();
const a=ps[33],b=ps[263],nose=ps[1];if(a&&b&&nose){group.rotation.z=-Math.atan2(b.y-a.y,b.x-a.x);group.rotation.y=THREE.MathUtils.clamp((nose.x-(a.x+b.x)/2)*2.5,-.65,.65);group.rotation.x=THREE.MathUtils.clamp((nose.y-(a.y+b.y)/2)*2.2,-.5,.5);$("#pose").textContent="頭部推定 · yaw "+group.rotation.y.toFixed(2)+" · pitch "+group.rotation.x.toFixed(2)}}
function render(){raf=requestAnimationFrame(render);if(video.readyState<2||!faceModel||!handModel||video.currentTime===lastTime){renderer.render(scene,camera);return}lastTime=video.currentTime;const w=video.videoWidth,h=video.videoHeight;if(!w||!h)return;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}ctx.clearRect(0,0,w,h);
const now=performance.now(),fr=faceModel.detectForVideo(video,now),hr=handModel.detectForVideo(video,now),face=fr.faceLandmarks?.[0];$("#faces").textContent=String(fr.faceLandmarks?.length||0);$("#hands").textContent=String(hr.handLandmarks?.length||0);
if(face){drawPoints(face,"#7ce0c3",1.15);update3d(face);const jaw=fr.faceBlendshapes?.[0]?.categories?.find(x=>x.categoryName==="jawOpen");$("#jaw").textContent=jaw?jaw.score.toFixed(2):"—"}else{pointsGeometry.setAttribute("position",new THREE.Float32BufferAttribute([],3));wireGeometry.setAttribute("position",new THREE.Float32BufferAttribute([],3));$("#jaw").textContent="—"}
for(const hand of hr.handLandmarks||[]){drawConnections(hand,handEdges,"#00dfff",2);drawPoints(hand,"#00dfff",2)}renderer.render(scene,camera)}
start.onclick=async()=>{if(!faceModel||!handModel){status.textContent="モデルの読み込みを待ってください。";return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});video.srcObject=stream;await video.play();start.disabled=true;stop.disabled=false;status.textContent="カメラ動作中";cancelAnimationFrame(raf);render()}catch(e){console.error(e);status.textContent="カメラを利用できません。HTTPS/localhost と権限を確認してください。"}};
stop.onclick=()=>{cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;ctx.clearRect(0,0,canvas.width,canvas.height);pointsGeometry.setAttribute("position",new THREE.Float32BufferAttribute([],3));wireGeometry.setAttribute("position",new THREE.Float32BufferAttribute([],3));$("#faces").textContent="0";$("#hands").textContent="0";$("#jaw").textContent="—";start.disabled=false;stop.disabled=true;status.textContent="カメラ停止中";renderer.render(scene,camera)};
resize3d();await loadModels();renderer.render(scene,camera);
</script></body></html>
