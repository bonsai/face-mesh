name: Deploy Face Mesh to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download model assets
        run: |
          mkdir -p public/models
          cp index.html README.md public/
          curl -fL --retry 3 \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task \
            -o public/models/face_landmarker.task
          curl -fL --retry 3 \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task \
            -o public/models/hand_landmarker.task
          cp -r .github-pages/* public/ 2>/dev/null || true
          cat > public/models/README.md <<'EOF'
          # Model assets
          - face_landmarker.task: official MediaPipe Face Landmarker bundle.
          - hand_landmarker.task: official MediaPipe Hand Landmarker bundle.
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
