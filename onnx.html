<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONNX Runtime Web Face Landmarks</title>
<style>:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#101318;color:#eef2f7;padding:16px}h1{font-size:1.2rem}p{color:#b7c1d0}.stage{position:relative;max-width:800px;aspect-ratio:4/3;background:#05070a}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}video{transform:scaleX(-1)}button{padding:10px 14px;border:0;border-radius:8px;background:#7ce0c3;font-weight:700;margin:12px 8px 12px 0}a{color:#7ce0c3}#status{white-space:pre-wrap;color:#b7c1d0}</style>
</head><body><h1>ONNX Runtime Web · Face Mesh landmarks</h1><p>Experimental landmark-network smoke test. This ONNX model expects a face crop, so this demo samples the center crop and does not include a face detector.</p><a href="./">← MediaPipe demo</a> · <a href="./tfjs.html">TensorFlow.js demo</a>
<div class="stage"><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas></div><button id="start">Start camera</button><button id="stop" disabled>Stop</button><div id="status">Loading ONNX model…</div>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script>
const video=document.querySelector("#video"), canvas=document.querySelector("#canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true}),status=document.querySelector("#status"),start=document.querySelector("#start"),stop=document.querySelector("#stop");
let session=null,stream=null,raf=0,busy=false,last=0;
async function init(){try{session=await ort.InferenceSession.create(new URL("./models/face_landmarks.onnx",document.baseURI).href,{executionProviders:["wasm"]});status.textContent="ONNX model loaded. Center your face in the frame, then start the camera."}catch(e){console.error(e);status.textContent="ONNX model load failed. Wait for the GitHub Pages model-download workflow to finish."}}
async function tick(){raf=requestAnimationFrame(tick);if(!session||video.readyState<2||busy||video.currentTime===last)return;last=video.currentTime;busy=true;try{
const w=video.videoWidth,h=video.videoHeight; if(!w||!h)return;const side=Math.min(w,h),sx=(w-side)/2,sy=(h-side)/2;
const inputCanvas=document.createElement("canvas");inputCanvas.width=256;inputCanvas.height=256;const ic=inputCanvas.getContext("2d",{willReadFrequently:true});ic.drawImage(video,sx,sy,side,side,0,0,256,256);
const pixels=ic.getImageData(0,0,256,256).data, data=new Float32Array(256*256*3);for(let i=0,j=0;i<pixels.length;i+=4){data[j++]=pixels[i]/255;data[j++]=pixels[i+1]/255;data[j++]=pixels[i+2]/255}
const inputName=session.inputNames[0],out=await session.run({[inputName]:new ort.Tensor("float32",data,[1,256,256,3])});
const values=out.Identity?.data||out[session.outputNames[0]].data;canvas.width=w;canvas.height=h;ctx.clearRect(0,0,w,h);ctx.fillStyle="#7ce0c3";
for(let i=0;i+2<values.length;i+=3){const x=sx+values[i]/256*side,y=sy+values[i+1]/256*side;ctx.beginPath();ctx.arc(w-x,y,1.3,0,Math.PI*2);ctx.fill()}
status.textContent="ONNX Runtime Web · "+Math.floor(values.length/3)+" output points · center crop only";
}catch(e){console.error(e);status.textContent="Inference error: "+e.message}finally{busy=false}}
start.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});video.srcObject=stream;await video.play();start.disabled=true;stop.disabled=false;tick()}catch(e){status.textContent="Camera unavailable. Use HTTPS/localhost and allow camera access."}};
stop.onclick=()=>{cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;start.disabled=false;stop.disabled=true};
init();
</script></body></html>
